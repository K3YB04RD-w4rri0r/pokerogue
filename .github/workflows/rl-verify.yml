name: RL Verify

on:
  push:
    branches:
      - beta
      - rl-framework
    paths:
      - "src/rl/**"
      - "test/rl/**"
      - "tools/**"
      - "scripts/rl-*.sh"
      - "vite.rl.config.ts"
      - "requirements-rl.txt"
      - ".github/workflows/rl-verify.yml"
  pull_request:
    paths:
      - "src/rl/**"
      - "test/rl/**"
      - "tools/**"
      - "scripts/rl-*.sh"
      - "vite.rl.config.ts"
      - "requirements-rl.txt"
      - ".github/workflows/rl-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rl-quick:
    name: RL quick gate (tests + bitwise parity + smoke anchor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with game-data submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rl.txt

      - name: Install python dependencies
        run: pip install -r requirements-rl.txt

      - name: Run the RL quick verification gate
        run: bash scripts/rl-verify.sh quick
