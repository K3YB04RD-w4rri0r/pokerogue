# Python packaging for the RL environment (the `rl` package under src/).
#
#   pip install -e .              # library API: from rl.pokerogue_env import PokeRogueEnv
#   pip install -e ".[train]"     # + sb3 / torch
#   pip install -e ".[rendered]"  # + websocket-client (browser transport tools)
#
# The Node game bundle is a separate build artifact: run `pnpm rl:build`
# in the repo (or point POKEROGUE_RL_CLI at an existing dist/rl/cli.js).
# The repo's tools/ and examples/ keep working without installation
# (they sys.path the src/ tree).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerogue-rl"
version = "0.9.0"
description = "PokeRogue as a Gymnasium reinforcement-learning environment (headless + browser-rendered)"
readme = "src/rl/README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29",
  "pyyaml>=6",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch"]
rendered = ["websocket-client>=1.6"]

[tool.setuptools]
package-dir = { "rl" = "src/rl" }
packages = ["rl"]

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["src/rl/**/*.py", "tools/**/*.py", "examples/rl/**/*.py"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes core; I: import order; B: bugbear (real bug patterns);
# UP: pyupgrade (but keep 3.10 compat via target-version); BLE: no blind except.
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = [
  "E501",   # long lines: docstrings/tables read better unwrapped; format handles code
  "E402",   # module-import-not-at-top: the sys.path bootstrap pattern requires it
]

[tool.ruff.lint.per-file-ignores]
# The encoder mirrors spaces.ts table-for-table; the dense `buf[pos] = x; pos += 1`
# one-liner idiom keeps each dim on one line for side-by-side parity review.
"src/rl/observation.py" = ["E702"]
# The gymnasium env and verify harness intentionally catch broad exceptions at
# process/teardown boundaries (documented at each site).
"src/rl/pokerogue_env.py" = ["BLE001"]
"tools/**" = ["BLE001"]
